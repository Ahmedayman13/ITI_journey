    <script>
      //  odd / even
      var num = Number(prompt("Enter a number"))
      if (num % 2 == 0) {
        console.log(num + " is even")
      } else {
        console.log(num + " is odd")
      }

      //  loop 1 to 10
      for (var i = 1; i <= 10; i++) {
        console.log(i)
      }

      //  sign check
      if (num > 0) {
        console.log("positive")
      } else if (num < 0) {
        console.log("negative")
      } else {
        console.log("zero")
      }

      //  multiplication table
      for (var j = 1; j <= 10; j++) {
        console.log(num + " x " + j + " = " + num * j)
      }

      // 5.5 day of week (1 = Sunday)
      var dayNum = Number(prompt("Enter a day number from 1 to 7"))
      switch (dayNum) {
        case 1: 
        console.log("Sunday"); 
        break
        
        case 2:
           console.log("Monday"); 
           break
        case 3: 
        console.log("Tuesday"); 
        break
        case 4: 
        console.log("Wednesday"); 
        break
        case 5: 
        console.log("Thursday"); 
        break
        case 6: 
        console.log("Friday"); 
        break
        case 7: 
        console.log("Saturday"); 
        break
        default: console.log("Invalid day number")
      }

      // weekend 
      if (dayNum == 6 || dayNum == 7) {
        console.log("Weekend")
      } else if (dayNum >= 1 && dayNum <= 5) {
        console.log("Weekday")
      } else {
        console.log("Invalid day number")
      }
    </script>
