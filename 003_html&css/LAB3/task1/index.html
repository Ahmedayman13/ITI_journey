<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task1</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        header,ul{
            display: flex;
            color: white;
            
        }
        header  {
            justify-content: space-between;
            background-color: blueviolet;
            padding: 20px 30px;
        }
        ul{
            gap: 20px;
            list-style-type: none;
            
        }
        a{
            text-decoration: none;
            color: white;
        }
        
    
        main{
            display: flex;
            height: 80vh;
            width: 100%;
        }
        aside,.sections{
            display: flex;
            justify-content: center;
            align-items: center;
            
        }
        aside{
            width: 40%;
            background-color: rgb(116, 7, 126);
            color: white;
            font-weight: bold;
            font-size: 24px;
            letter-spacing: 2px;
            
        }
        .sections{
            width: 60%;
            display: flex;
            flex-direction:column;
        }
        section{
            height: calc(100%/3);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            color: white;
            font-weight: bold;
            background-color: rgb(35, 3, 65);
            width: 100%;
            border: 1px solid white;
        }
        footer{
            background-color: blueviolet;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            height: 180px;
        }
        
    </style>
</head>
<body>
    <header>
        <h2>Logo</h2>
        <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Products</a></li>
        <li><a href="#">Contact</a></li>
        </ul>
    </header>
    <main>
        
            <aside>Aside</aside>
            <div class="sections">
            <section>Section1</section>
            <section>Section2</section>
            <section>Section3</section>
            </div>
            
        
    </main>
    <footer>Footer</footer>
</body>
</html>
